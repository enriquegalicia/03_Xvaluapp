name: Xvaluapp
options:
  bundleIdPrefix: com.Magnificent
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  XvaluappCore:
    path: ../XvaluappCore
targets:
  Xvaluapp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: XvaluappCore
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Xvaluapp uses the local network to sync scores between judge, master, and screen devices at the same event — no internet connection required."
        NSBonjourServices:
          - _xvaluapp-sync._tcp
          - _xvaluapp-sync._udp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Magnificent.XvaluappSwift
        PRODUCT_NAME: Xvaluapp
        GENERATE_INFOPLIST_FILE: NO
