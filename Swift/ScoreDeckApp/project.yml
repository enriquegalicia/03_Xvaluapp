name: ScoreDeck
options:
  bundleIdPrefix: com.aguach1leLabs
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  XvaluappCore:
    path: ../XvaluappCore
  # These two live in a sibling repo (Aguach1leLabs), not inside this one —
  # unlike every other consumer of AguaDesign/AguaAI, which sits alongside
  # Packages/ in that same repo. This path only resolves if both repos stay
  # checked out at their current relative location on disk (see CLAUDE.md,
  # "Which app ships"); if that ever changes, update these two paths or
  # switch them to a git-URL package reference instead.
  AguaDesign:
    path: ../../../../Xcode/Aguach1leLabs/Packages/AguaDesign
  AguaAI:
    path: ../../../../Xcode/Aguach1leLabs/Packages/AguaAI
targets:
  ScoreDeck:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: XvaluappCore
      - package: AguaDesign
      - package: AguaAI
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        # No custom/proprietary encryption — only standard HTTPS/TLS (to
        # OpenAI, when the user's added a key) and MultipeerConnectivity's
        # own required AES session encryption, both exempt. Skips the "does
        # your app use encryption" prompt on every App Store Connect upload.
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: en
        # Actual values live in InfoPlist.xcstrings per language; this is
        # the development-region fallback GENERATE_INFOPLIST_FILE: NO still
        # needs baked into the base Info.plist.
        CFBundleLocalizations:
          - en
          - es
        NSLocalNetworkUsageDescription: "ScoreDeck uses the local network to sync scores between judge, master, and screen devices at the same event — no internet connection required."
        NSBonjourServices:
          - _scoredeck-sync._tcp
          - _scoredeck-sync._udp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aguach1leLabs.ScoreDeck
        PRODUCT_NAME: ScoreDeck
        GENERATE_INFOPLIST_FILE: NO
